name: Calidad y tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: ['feat/**']
jobs:
  quality:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
        env:
          # La compilación no debe necesitar acceso a producción.
          NEXT_TELEMETRY_DISABLED: '1'
  integration:
    name: PostgreSQL real y RLS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:integration

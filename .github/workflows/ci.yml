name: Calidad y tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: ['feat/**']
permissions:
  contents: write

jobs:
  quality:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Ordenar imports y aplicar convenciones
        run: npm run lint:fix || true
      - name: Formatear fuentes con Prettier
        run: npm run format
      - name: Guardar correcciones mecánicas en la rama de trabajo
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feat/')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests scripts package.json package-lock.json *.config.* .github/workflows/ci.yml
          if ! git diff --cached --quiet; then
            git commit -m 'style: format and sort source automatically [skip ci]'
            git push origin HEAD:${{ github.ref_name }}
          fi
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
        env:
          # La compilación no debe necesitar acceso a producción.
          NEXT_TELEMETRY_DISABLED: '1'
  integration:
    name: PostgreSQL real y RLS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:integration

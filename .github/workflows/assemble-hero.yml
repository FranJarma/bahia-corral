name: Reconstruir imagen aprobada de Figma
on:
  push:
    branches: ['feat/mvp-36-tasks']
    paths:
      - 'assets/hero-parts/**'
permissions:
  contents: write
jobs:
  assemble:
    if: startsWith(github.event.head_commit.message, 'assets: stage approved Figma hero')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruir asset original en el repositorio
        run: |
          mkdir -p public/images
          cat assets/hero-parts/part-01.bin assets/hero-parts/part-02.bin assets/hero-parts/part-03.bin > public/images/hero-figma.jpg
          node - <<'NODE'
          const fs=require('fs');
          const b=fs.readFileSync('public/images/hero-figma.jpg');
          if(b.length!==1218089||b[0]!==255||b[1]!==216||b[b.length-2]!==255||b[b.length-1]!==217)throw new Error('Archivo JPG incompleto');
          let a=1,z=0;
          for(const v of b){a=(a+v)%65521;z=(z+a)%65521;}
          const checksum=((z<<16)|a)>>>0;
          if(checksum!==2411596000)throw new Error('Checksum Figma no coincide: '+checksum);
          console.log('Hero original verificado:',b.length,'bytes; Adler32=',checksum);
          NODE
      - name: Guardar el recurso consolidado en la rama
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r assets/hero-parts
          git add public/images/hero-figma.jpg
          git -c core.hooksPath=/dev/null commit -m "assets: add approved Figma hero photo [skip ci]"
          git push origin HEAD:feat/mvp-36-tasks
